[package]
name = "oauth-as"
version = "0.9.0"
edition = "2021"
# MEASURED, not declared. 1.74 fails on return-position impl Trait in the Storage trait (RPITIT,
# stabilised in 1.75); 1.75 compiles and tests clean. Going lower would mean Box<dyn Future> in
# Storage, a heap allocation on every storage call, paid forever by every consumer to support
# toolchains older than December 2023. See KICKOFF.md's MSRV entry.
rust-version = "1.75"
description = "An embeddable OAuth 2.1 Authorization Server library: spec-mirroring types (RFC 6749, RFC 8628, RFC 7636), a full device-authorization-grant state machine, and a storage trait the host implements. Deliberately host-agnostic with a tiny dependency set; nothing is allocated until the host constructs an AuthorizationServer, so an embedding host pays zero memory until its config enables the feature."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MattJackson/oauth-as"
homepage = "https://github.com/MattJackson/oauth-as"
documentation = "https://docs.rs/oauth-as"
readme = "../../README.md"
keywords = ["oauth", "oauth2", "authorization", "device-flow", "pkce"]
categories = ["authentication", "web-programming"]

# conformance-serve.sh is launched by scripts/oauth-conformance.sh from a git checkout and
# resolves the workspace root as ../.., which does not exist in an unpacked tarball. It is broken
# by construction for a consumer, so shipping it would only mislead. The EXAMPLE it runs is kept,
# because it is the only worked demonstration of wiring the optional http router.
exclude = ["conformance-serve.sh"]

# FEATURES. The default set is EMPTY and stays that way. A consumer who wants only the library
# gets no HTTP stack and no async runtime: the whole premise of this crate is that the host owns
# the listener, so an optional feature is the only place a web framework may appear.
[features]
default = []
# `http` adds an axum router over AuthorizationServer, for hosts that want the RFC-shaped wire
# surface rather than writing it themselves, and for the black-box conformance harness (which
# needs an external process to talk to). Nothing in the library depends on it.
http = ["dep:axum", "dep:tokio"]
# RFC 9068 `at+jwt` access tokens signed with ES256, plus the RFC 7517 JWKS document that lets a
# resource server verify them without calling this server. Opaque tokens remain the DEFAULT: JWT
# is an optional profile, not an OAuth 2.1 requirement, and it earns its keep only when resource
# servers are separate processes that should not have to call introspection on every request.
jwt = ["dep:p256"]
# RFC 8705 mutual-TLS client authentication and certificate-bound access tokens.
# OFF by default, and it adds NO dependency: TLS termination is the host's job in this
# crate (it never sees a socket), so the host hands in a certificate it has already
# verified and parsed, and the only arithmetic RFC 8705 defines on it is the section 3.1
# SHA-256 thumbprint. `sha2` and `base64` are already here for RFC 7636 PKCE. An X.509
# parser would add attack surface to recompute what the host must already know.
mtls = []
# RFC 9126 pushed authorization requests: the client POSTs the authorization request to a
# back-channel endpoint and gets a single-use `request_uri` handle, so the parameters (the PKCE
# challenge above all) never traverse the browser. Adds no dependency: it is storage plus the
# validation the authorization endpoint already performs.
par = []
# RFC 9101 JWT-secured authorization requests: a signed request object, verified against the key
# the client registered. Enables `jwt` because verification is ES256 over the same p256 dependency
# the RFC 9068 signer already uses, and because the JWS primitives being added there for RFC 7523
# and DPoP are where this verification belongs once they land (see the SEAM note in src/par.rs).
jar = ["jwt"]
# RFC 7523 JWT client authentication: `private_key_jwt` (asymmetric, ES256) and `client_secret_jwt`
# (HMAC, HS256), so that a deployment whose security policy forbids transmitting a shared secret can
# use this crate at all. It is also required by FAPI 2.0.
#
# IMPLIES `jwt`, and that is a decision rather than an accident. This and `dpop` both rest on JWS
# VERIFICATION, and this crate holds exactly ONE copy of that code (see the VERIFICATION banner in
# src/jwt.rs). Two half-built verifiers behind two independent feature flags is how a codebase ends
# up with an algorithm-confusion bug in whichever half nobody reviewed. Neither feature adds a
# dependency: ES256 verification is the `p256` that `jwt` already pulls in, and HMAC-SHA-256 is
# twenty lines over the `sha2` that PKCE already required.
client_assertion = ["jwt"]
# RFC 9449 DPoP: sender-constrained access tokens, bound to a key the client proves possession of on
# every request. Without it every token this crate issues is a bearer token, so a stolen one is
# usable by whoever stole it; this changes what a leak costs. IMPLIES `jwt` for the reason above.
dpop = ["jwt"]
# RFC 9728 protected resource metadata. This crate is an AUTHORIZATION SERVER, not a
# resource server, so what this feature adds is the TYPE a host publishes for its OWN
# resource, plus the section 4 `protected_resources` member on the AS metadata document.
# It does not make this crate a resource server and does not serve anything by itself.
# No dependency: it is serde shapes over the serde that is already here.
resource-metadata = []
# RFC 8693 token exchange: delegation and impersonation for service-to-service calls.
# OFF by default because it is a grant that mints a token from a token, and a deployment
# that has not decided its delegation policy should not have the endpoint compiled in.
token-exchange = []
# A RUNNABLE conformance harness for the `Storage` contract, for a HOST to call from its
# own test suite against its own implementation (crates/oauth-as/src/storage_conformance.rs).
#
# It is a cargo feature rather than a separate crate because it tests a trait whose
# semantics live here, and because a host already depends on this crate. OFF by default and
# it adds NO dependency: the concurrency primitives it needs are hand-written over std, so a
# default build pays nothing for it, in code or in tree.
#
# WHY IT EXISTS AT ALL: `Storage::take_*` is documented as an ATOMIC remove-and-return, and
# that clause is the only thing making single-use artifacts single use. A host that
# implements it as read-then-delete compiles, type-checks, and passes a single-node test
# suite, while a multi-node deployment silently double-spends refresh tokens and stops
# detecting authorization code replay. Nothing inside this crate can see that, so the check
# has to be runnable where the host's store is.
test-util = []

# DEPENDENCY POLICY: the runtime dependency set is deliberately tiny, and none of these
# implies an async runtime, an HTTP stack, or a persistence layer; the HOST owns all three.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"              # PKCE S256 (RFC 7636); verified against the RFC's appendix B vector
base64 = "0.22"            # BASE64URL-without-padding, the exact PKCE challenge encoding

# OPTIONAL, feature `http` only. `default-features = false` keeps the pulled-in tree to what the
# router actually uses: no JSON extractor (bodies are serialized here so the RFC-mandated headers
# are set on the same response), no tracing, no multipart.
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }
# Needed only because `axum::serve` (and therefore any host or example that binds a listener)
# needs a runtime. The router itself is runtime-agnostic.
tokio = { version = "1", optional = true, default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread"] }

# OPTIONAL, feature `jwt` only. ES256 signing for RFC 9068 access tokens.
#
# WHY p256 AND NOTHING ELSE: it is pure Rust (no cc, no bindgen, no OpenSSL), it is the RustCrypto
# P-256 implementation the ecosystem already audits, and with default features off it pulls only
# elliptic-curve/ecdsa/sha2 primitives; sha2 is ALREADY a dependency here for PKCE. No general JOSE
# framework is used: this crate emits exactly one token shape, so the JWS compact serialization
# lives in src/jwt.rs on top of serde_json and base64, both already present. A JOSE framework would
# add a parser, a validator and a key-format zoo that an ISSUER never executes.
#
# WHY ES256 AND NOT RS256: RFC 9068 fixes neither, but an ES256 signature is 64 bytes against
# RSA-2048's 256, and a P-256 public key is 64 bytes against 259. That difference is paid on every
# token issued and every JWKS fetch.
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",  # ECDSA/P-256/SHA-256 signing, which is ES256 (RFC 7518 s3.4)
    "pkcs8",  # so a host can load the key format its KMS or openssl already emits
    "std",    # this crate is std anyway; adds no crate to the tree, only alloc/error impls
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
# IN-TREE CONFORMANCE CHECKS (dev-only; never in any shipped binary):
#   - `oauth2` is a widely used third-party OAuth 2 CLIENT. tests/third_party_client.rs drives it
#     against this AS as a black box through its pluggable HTTP-client seam, so the CLIENT library
#     (not our own assertions) decides whether our device-flow responses and error bodies are
#     spec-legal. Pinned exactly: a silent client upgrade must never change what "conformant" means.
#   - tests/conformance_schema.rs validates every emitted body against the RFC 6749 section 5 and
#     RFC 8628 section 3.2 / 3.5 clauses, transcribed as plain Rust.
#
# NO JSON SCHEMA VALIDATOR HERE, and that is deliberate. `jsonschema` used to hold that last job.
# It is taken with default features (resolve-http, resolve-file, tls-aws-lc-rs) merely to check
# in-memory serde_json::Values, so it pulled a SECOND reqwest alongside the harness's, plus hyper,
# h2, rustls and the aws-lc-sys C/asm build, for a validator that never resolves a remote $ref and
# never opens a socket. MEASURED: dropping it removed 88 packages from Cargo.lock and took
# `cargo tree -e normal,dev -p oauth-as` from 407 lines to 157. It also declares
# rust-version = 1.85, which was the loudest of the reasons the MSRV job could only BUILD rather
# than TEST at this crate's 1.75 floor; it was not the only one, and that job's comment records
# what still blocks it. Every clause it checked is now checked in Rust, with a red-proof per
# clause; see that test's module docs for the one clause that was dropped (format: "uri", an
# ANNOTATION in Draft 2020-12, which asserted nothing).
# The INDEPENDENT harness (written without sight of this crate) lives in
# crates/oauth-as-conformance in this repository.
oauth2 = { version = "=5.0.0", default-features = false }
http = "1"
url = "2"

# The conformance serve shim (crates/oauth-as/conformance-serve.sh) runs this example. It carries
# the deterministic fixtures the black-box harness's launch contract asks for; the LIBRARY must
# never ship conformance fixtures, so they live here and nowhere else.
#
# `jwt` is required as well as `http` because the harness verifies the issued access token as an
# RFC 9068 `at+jwt` against the advertised jwks_uri. Requiring it, rather than degrading to opaque
# tokens when the feature is off, keeps the failure at build time and legible: a conformance
# fixture that quietly stops exercising signing is worse than one that refuses to build.
[[example]]
name = "conformance_server"
required-features = ["http", "jwt"]

# The RFC 9728 fixture resource (see the example's own module docs for why an AUTHORIZATION SERVER
# crate ships a resource-server example, and for what it deliberately is not). `http` for the
# listener, `resource-metadata` for the type it serves.
[[example]]
name = "protected_resource_fixture"
required-features = ["http", "resource-metadata"]
