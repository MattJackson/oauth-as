[package]
name = "oauth-as-postgres"
version = "0.9.3"
edition = "2021"
# NOT the core crate's 1.75 floor, and that is a deliberate consequence of this being a SEPARATE
# crate rather than a feature of `oauth-as`. sqlx and its tree declare their own, higher, floor.
# Keeping the two apart is what lets the core keep a floor a consumer can actually adopt: a host
# that wants only the protocol never sees this manifest at all.
rust-version = "1.81"
description = "A PostgreSQL implementation of the oauth-as Storage trait, with genuinely atomic single-use redemption (DELETE ... RETURNING)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MattJackson/oauth-as"
readme = "README.md"
# NOT PUBLISHED. See README.md: this crate has never been released to crates.io and the version
# number tracks the `oauth-as` it implements, nothing more. Flipping this to true is a decision
# the owner makes, not a default anyone should inherit.
publish = false

[features]
default = []

# Each of these exists ONLY to turn on the matching feature of `oauth-as`, because the trait
# methods they gate are `#[cfg]`-ed in the trait itself. A consumer therefore pays for exactly
# what the core was compiled with: enabling nothing here compiles neither the PAR, the consent nor
# the replay-id code, and `migrate()` does not create their tables.
par = ["oauth-as/par"]
consent = ["oauth-as/consent"]
client-assertion = ["oauth-as/client-assertion"]
dpop = ["oauth-as/dpop"]
# Fields on the persisted records are themselves feature-gated in the core, and NOTHING under this
# crate's `src/` or `tests/` is `#[cfg]`-ed on any of these three: the payload is serde over the
# core's own types, so `store.rs` serialises whatever those types are in this build.
#
# THEY ARE PURE RE-EXPORTS, and the reason they exist is NOT that the two crates could otherwise
# disagree about the shape of a record. They could not: cargo unifies features across a build
# graph, so there is exactly one compiled `oauth-as` rlib and therefore exactly one `IssuedToken`.
# (The comment here claimed otherwise until the 0.9.1 audit, which is worth recording because the
# false claim is the plausible one.) What they buy is the ability to ENABLE the core feature from a
# manifest that names only this crate: a host that wants RFC 8705 thumbprints, RFC 9396 details or
# RFC 8693 delegation persisted has one line to write here rather than a second direct dependency
# on `oauth-as` carrying the feature, which is the coupling this crate exists to spare it.
mtls = ["oauth-as/mtls"]
rar = ["oauth-as/rar"]
# RFC 8693 delegation. It gates `IssuedToken::act`, so without this line a host doing token
# exchange had no way to reach the field from a manifest naming only this crate.
token-exchange = ["oauth-as/token-exchange"]

# The integration tests need a REAL PostgreSQL. They are behind a feature, off by default, so that
# `cargo test --workspace` on a machine with no database stays green and honest rather than
# silently skipping. With this on, a missing OAUTH_AS_POSTGRES_TEST_URL is a PANIC, not a skip;
# see tests/README-style module docs in tests/postgres.rs.
#
# It also switches ON the feature-gated halves of the trait, because a conformance run that
# skipped them would be a green nobody should quote. THE FIELD-ONLY FEATURES ARE HERE TOO, for the
# same reason: through 0.9.1 this list stopped at the four method-gating features, so `act`,
# `x5t_s256` and `authorization_details` were never in a payload that round-tripped against a real
# server, and no test in this crate could even NAME them. See `tests/persisted_shape.rs`.
pg-integration = [
    "consent",
    "par",
    "client-assertion",
    "dpop",
    "mtls",
    "rar",
    "token-exchange",
]

[dependencies]
oauth-as = { version = "0.9", path = "../oauth-as" }
# THE DRIVER. See README.md "Why sqlx" for the full reasoning; the short version is that the
# RUNTIME query API (`sqlx::query`, not `sqlx::query!`) needs no database to COMPILE, and the
# connection pool and transaction types are in the box. `default-features = false` drops the
# macros, the CLI-facing migrator, and every TLS backend: this crate opens no socket the host did
# not configure, and a TLS stack it does not use would be attack surface plus a C toolchain.
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",       # the wire protocol, nothing else
    "runtime-tokio",  # the async runtime the trait's Send futures are driven on
    "json",           # so a record payload can be bound as jsonb without hand-rolling its wire form
] }
# The record payload is `serde_json::to_value` over the core's own types, which already derive
# Serialize/Deserialize unconditionally. No mapping layer, and no risk of this crate's idea of a
# record drifting from the core's.
serde = "1"
serde_json = "1"

[dev-dependencies]
# `test-util` is the core's exported conformance harness. It is a DEV dependency feature and not a
# feature of this crate on purpose: it adds no method to the `Storage` trait, so unifying it into
# the test build cannot change what this crate has to implement.
oauth-as = { version = "0.9", path = "../oauth-as", features = ["test-util"] }
# The harness's `with_spawn` mode needs a multi-threaded runtime for the races to be real races
# rather than an interleaving, and the two-connection test needs a barrier. `time` is for
# `tests/revocation_races.rs`, which holds a write open while a revocation commits and has to give
# the revocation a bounded opportunity to finish first; see that file on why the wait is not a
# race it could lose.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
