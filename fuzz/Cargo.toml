# The fuzz targets. NEVER PUBLISHED, and nothing in crates/oauth-as depends on it: this is a
# CONSUMER of the library's public API, exactly like a host would be, so adding a target here can
# never change what a consumer of `oauth-as` compiles or links.
#
# ITS OWN WORKSPACE, deliberately. The root manifest carries the full argument (see the
# `exclude = ["fuzz"]` block there); the short version is that this crate must enable `par`,
# `jar`, `dpop`, `client_assertion` and the rest in order to fuzz the parsers behind them, and
# under resolver 2 a member's features are unified into every other member's build. Membership
# therefore turned those features on for `oauth-as-postgres` and for `oauth-as`'s own test
# targets and broke both. Excluded, this manifest resolves alone and cannot reach them.
#
# The rot protection membership was wanted for is kept as an explicit `cargo clippy --all-targets
# -- -D warnings` against THIS manifest, in the `fuzz` job of .github/workflows/qa.yml.
[package]
name = "oauth-as-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"
# NOT the library's 1.75 floor, and deliberately not tied to it. cargo-fuzz requires nightly, so
# there is nothing to be gained by constraining this member, and nothing depends on it. The MSRV
# job in .github/workflows/qa.yml is scoped to `-p oauth-as` for exactly this reason.
rust-version = "1.75"

[package.metadata]
cargo-fuzz = true

# An empty table, which is what makes this an independent workspace root rather than a member of
# the one above it. See the header of this file and `exclude = ["fuzz"]` in the root manifest.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# Structure-aware generation. A purely random byte string is a parse error for a JWS or a JSON
# array on essentially every draw, so those targets would spend their whole budget in the first
# ten lines of the parser. `arbitrary` lets the generator start from a well formed shape and
# perturb it, which is what puts the fuzzer past the front door.
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
http = "1"
# A current-thread runtime, built ONCE and reused, for the targets whose entry point is an
# `async fn` on AuthorizationServer. Building a runtime per iteration would dominate the
# iteration cost and hide the parser being measured.
tokio = { version = "1", features = ["rt"] }

# EVERY optional feature that gates one of the parsers under test. `axum` is deliberately absent:
# the adapter is thirty lines of `From` impl with no parsing in it, and pulling a pre-1.0 web
# framework into the fuzz build would only add build time.
[dependencies.oauth-as]
path = "../crates/oauth-as"
default-features = false
# `jwt-p256` rather than `jwt`: every one of these targets has to PRODUCE the credential it then
# corrupts, and since the ES256 seam landed `jwt` is the trait surface and carries no curve. A
# fuzzer that cannot sign cannot reach the verifier it exists to fuzz.
features = ["http", "jwt-p256", "rar", "par", "jar", "dpop", "client_assertion", "mtls"]

# The shared fixtures (the server under test, the JWS builders, the RFC charset predicates). A
# `lib` rather than an `#[path]` include in each target, so there is ONE definition of "the
# registered client" and a target cannot silently disagree with its neighbours about it.
[lib]
name = "oauth_as_fuzz"
path = "src/lib.rs"

# Every target below is `test = false, doc = false, bench = false`. They are `#![no_main]` and
# their `main` comes from libFuzzer, so there is nothing for the test or doc harness to do; the
# flags keep `cargo test --workspace` from trying to link them against a runtime that only the
# nightly sanitizer build supplies.

[[bin]]
name = "scope_parse"
path = "fuzz_targets/scope_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "device_user_code"
path = "fuzz_targets/device_user_code.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rar_parse"
path = "fuzz_targets/rar_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jws_parse"
path = "fuzz_targets/jws_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwk_from_json"
path = "fuzz_targets/jwk_from_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authorization_from_pairs"
path = "fuzz_targets/authorization_from_pairs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_credentials"
path = "fuzz_targets/http_credentials.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_assertion"
path = "fuzz_targets/client_assertion.rs"
test = false
