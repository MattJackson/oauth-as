# PUBLISH stage: crates.io publish of oauth-as.
#
# The pipeline is: push to `dev` often (fast Rust gate) -> promote to `qa` (full suite, third
# party and release checks) -> promote to `main`, and REACHING MAIN IS THE RELEASE. main is the
# published branch: what is on it is what is on crates.io.
#
# A crates.io publish is PERMANENT. A version can be yanked, never deleted, and a version number
# can never be reused. So "push to main publishes" is only safe because of two properties, and
# both are load-bearing:
#
#   1. THE VERSION NUMBER DECIDES, NOT THE PUSH. This workflow reads the version from
#      crates/oauth-as/Cargo.toml and asks crates.io whether it already exists. If it does, the
#      run stops green without publishing. So a README fix, a CI tweak, or a merge that does not
#      bump the version is a no-op, and pushing to main twice cannot publish twice. Releasing is
#      therefore a deliberate act -- editing the version in Cargo.toml -- that happens in a
#      reviewed commit, not a button pressed at the end.
#
#   2. THE ENVIRONMENT GATE PAUSES THE RUN. `environment: crates-io-publish` makes the publish
#      job wait for a human. NOTE: GitHub auto-creates a referenced environment on first use with
#      NO protection rules, so until the owner configures required reviewers this line stops
#      nothing. See the notes at the end of this file.
#
# workflow_dispatch is kept as an escape hatch: re-running a release whose publish step failed
# after the gate passed (a crates.io outage, an expired token) without inventing a version bump
# to re-trigger the push.
#
# NO continue-on-error anywhere: every step is load-bearing and a failure is RED.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional: the version you expect to publish. If set, the run refuses unless crates/oauth-as/Cargo.toml matches it exactly. Leave blank to publish whatever main says."
        required: false
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Split out from the publish job on purpose: this job has NO environment gate and NO token, so
  # it runs unattended on every push to main and decides whether there is anything to release.
  # The owner is only ever asked to approve a run that is genuinely going to publish something.
  decide:
    name: is there a new version to publish?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read the manifest version and ask crates.io if it exists
        id: check
        run: |
          set -euo pipefail

          manifest_version="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="oauth-as"))')"
          echo "manifest version: $manifest_version"
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"

          # If the dispatcher named a version, it must match. This is the only thing the manual
          # input does: it cannot choose WHAT to publish, only refuse a surprise.
          requested="${{ inputs.version }}"
          if [ -n "$requested" ] && [ "$requested" != "$manifest_version" ]; then
            echo "::error::you asked to publish $requested but crates/oauth-as/Cargo.toml says $manifest_version"
            exit 1
          fi

          # crates.io requires a User-Agent. A 404 means the crate does not exist at all, which
          # is a legitimate first publish -- distinguish it from a transport failure rather than
          # letting a network error read as "not published yet" and trigger a publish attempt.
          http_status="$(curl -sS -o /tmp/crate.json -w '%{http_code}' \
            -H 'User-Agent: oauth-as-release-ci (https://github.com/${{ github.repository }})' \
            "https://crates.io/api/v1/crates/oauth-as")"

          case "$http_status" in
            200)
              if python3 -c "
          import json, sys
          d = json.load(open('/tmp/crate.json'))
          sys.exit(0 if '$manifest_version' in {v['num'] for v in d['versions']} else 1)
          "; then
                echo "crates.io already has oauth-as $manifest_version -- nothing to publish"
                echo "should_publish=false" >> "$GITHUB_OUTPUT"
              else
                echo "crates.io does NOT have oauth-as $manifest_version -- this push is a release"
                echo "should_publish=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "crates.io has no oauth-as crate at all -- first publish"
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io returned HTTP $http_status; refusing to guess whether $manifest_version is already published"
              exit 1
              ;;
          esac

  publish:
    name: crates.io publish
    needs: decide
    if: needs.decide.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release tag after a successful publish
    # GitHub AUTO-CREATES this environment on first use with no protection rules. Until the owner
    # adds required reviewers in repository settings, this line does not gate anything. See the
    # notes at the end of this file.
    environment: crates-io-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Full gate before publish (fmt, clippy, test)
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: publish dry run (final check before the real thing)
        run: cargo publish --dry-run --locked -p oauth-as

      - name: package file list (final human-reviewable record)
        run: cargo package --list --locked -p oauth-as

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p oauth-as

      # AFTER the publish, not before. The tag records what was published; it is evidence, not a
      # precondition. Requiring the tag first would mean a failed publish leaves a tag claiming a
      # release that does not exist on crates.io.
      - name: Tag the published commit
        run: |
          set -euo pipefail
          tag="v${{ needs.decide.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists, leaving it alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "oauth-as $tag (published to crates.io by ${{ github.workflow }} run ${{ github.run_id }})"
          git push origin "$tag"

  # Runs when the push to main carried no version bump. Exists so the reason is visible in the
  # Actions tab: a green "nothing to publish" is a different fact from a workflow that never ran.
  no_release:
    name: no version bump, nothing to publish
    needs: decide
    if: needs.decide.outputs.should_publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "crates/oauth-as/Cargo.toml is at ${{ needs.decide.outputs.version }}, which is already on crates.io."
          echo "To release: bump the version in crates/oauth-as/Cargo.toml, take it through dev and qa, and promote to main."

# WHAT THE OWNER MUST CONFIGURE BY HAND (none of this can be done from inside a workflow file):
#
# 1. Repository secret CARGO_REGISTRY_TOKEN, holding a crates.io API token scoped to publish
#    oauth-as (Settings > Secrets and variables > Actions).
#
# 2. A GitHub Environment named "crates-io-publish" (Settings > Environments > New environment)
#    with "Required reviewers" turned on and the owner listed. THIS IS THE ONE THAT MATTERS:
#    because a push to main now publishes, the required reviewer is the last thing standing
#    between a merge and a permanent crates.io version. GitHub auto-creates the environment
#    unprotected the first time this workflow references it, so an unconfigured environment is
#    not an error anyone will see -- it is a gate that silently passes. Also set the "Deployment
#    branches and tags" rule to main only, so the environment's secret is unreachable from any
#    other branch.
#
# 3. Branch protection on main (Settings > Branches), requiring qa to have passed. main is now
#    the release branch, so write access to main is publish access to crates.io.
