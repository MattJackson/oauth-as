# Full suite for the oauth-as repository. Runs on every push to the qa branch, which exists
# so promotion here means "everything dev proved, plus everything that is too slow or too
# environment-sensitive to run on every push" has been proven, before main is ever considered.
#
# HONESTY (what the conformance jobs are, and are not):
#   There is no official OAuth 2.1 conformance suite: OAuth 2.1 is still an Internet Draft, so
#   no certification programme exists and no implementation can hold one.
#
#   CORRECTED for 0.9.0, and the earlier text in this file was WRONG. It said the OpenID
#   Foundation suite "presupposes OpenID Connect semantics" and therefore could not test this
#   crate. It can. The FAPI 2.0 Security Profile plans carry an `openid=plain_oauth` variant
#   that discovers through /.well-known/oauth-authorization-server, never asks for an id_token,
#   and yields a real certification profile name. It is still not run here, but for a list of
#   specific missing pieces (a protected resource endpoint, HTTPS, two static clients with
#   distinct keys, mandatory PAR, and a refresh-rotation policy that FAPI 2.0 s5.3.2.1-9 puts in
#   genuine tension with OAuth 2.1 s6.1) rather than for a category error. The full verdict,
#   with citations into the suite source and the specification, is in
#   crates/oauth-as-conformance/EXTERNAL-TOOLING.md. Do not re-derive it; do challenge it.
#
#   What runs instead:
#     1. Vendored RFC test vectors (RFC 7636 App B, RFC 7515 App A.1-A.3), byte-exact, plus
#        validator self-checks for RFC 9068, RFC 8414, RFC 6749 s5.1/s5.2, RFC 8628 s3.2/s3.5.
#     2. The conformance gate self-test: every gate is proven able to go RED (a corrupted
#        vector expectation must fail the suite; a deliberately nonconformant stub AS must
#        fail the black-box suite) before any green from it is trusted.
#     3. The live black-box run (scripts/oauth-conformance.sh --check), which starts the AS
#        via crates/oauth-as/conformance-serve.sh and drives it as a black box, including the
#        pinned third-party `oauth2 = "=5.0.0"` client. That shim is being built by another
#        workstream and may not exist in a given tree yet. This job is wired unconditionally:
#        if the shim is absent, the script fails loudly by design (see scripts/oauth-conformance.sh)
#        rather than passing vacuously, and that RED is correct, expected behaviour, not a bug
#        in this workflow. Do not make this job conditional on the shim's existence and do not
#        add continue-on-error to it: a gate that can pass without the shim is a gate that lies.
#     4. A SECOND independent third-party client, in a different language and from a different
#        author than the pinned Rust one: golang.org/x/oauth2 v0.36.0, pinned exactly with a
#        committed go.sum. It covers the client credentials and refresh-with-rotation grants that
#        the Rust drive does not, because a second opinion on the same question is worth less
#        than a first opinion on a new one. scripts/oauth-interop.sh, --selftest first.
#     5. `authgent` (github.com/authgent/authgent, Apache 2.0, PyPI `authgent-server`), NOW
#        WIRED IN, which reverses the decision recorded here on 2026-08-08 and in KICKOFF.md.
#        Nothing about the tool changed; this crate did. The scanner
#        (server/authgent_server/scanner.py) fetches RFC 9728 Protected Resource Metadata first
#        and, absent it, returns one critical "not an MCP server" finding and skips every
#        remaining check. That blocker is now removable honestly: RFC 9728 landed in the crate at
#        0.7.0, and crates/oauth-as/examples/protected_resource_fixture.rs stands up a loopback
#        test resource publishing a TRUE document that names this AS. The full argument for why
#        that is legitimate rather than the "true but substantively misleading" trap, and the
#        per-finding reasoning for the accepted baseline, is at the top of
#        scripts/oauth-mcp-lint.sh. Read it before changing this job.
#        THIS PROJECT IS NOT AN MCP SERVER. The scanner's MCP verdict is quoted nowhere. What is
#        quoted is that its RFC 8414, RFC 7636, RFC 9207, RFC 8707 and RFC 7591 checks were
#        applied to this crate's metadata document by a tool nobody here wrote.
#        The action reference `authgent/authgent/.github/actions/mcp-lint@v0.3.4` was verified
#        directly: the raw action.yml at that tag returns 200 and is a composite action. Their
#        marketplace README advertises `authgent/mcp-lint-action@v1`, a repository that does not
#        exist, and that reference is deliberately not used. `scanner-version` is pinned so the
#        action cannot silently install a newer scanner than the baseline was recorded against.
#        Note also that the action declares a `fail-on` input it never passes to the CLI, so the
#        threshold is always the default `error`; do not set `fail-on` here and expect it to do
#        anything.
#     6. OAuch (github.com/DistriNet/OAuch, MIT) is NOT wired in, and 0.9.0 closes the question
#        rather than deferring it again. ROADMAP.md asked for a headless spike or a written record
#        of why it is impossible; the record is section 4 of
#        crates/oauth-as-conformance/EXTERNAL-TOOLING.md. The short version is structural, not a
#        failure to look: `StartTests` has exactly one call site in the whole repository, inside
#        a SignalR hub method a live browser invokes, and `IBrowser` has exactly one
#        implementation, a proxy onto that same SignalR connection. The device flow specifically
#        inserts a `NotifyUser` step that opens a popup and asks a person to type the user code.
#        No project sets OutputType to Exe, there are zero [ApiController] and zero [Route]
#        attributes, no OpenAPI definition, and no git tags. The authors say it in their own RAID
#        2022 paper: "As a result, OAuch is not fully automated." Last commit 2026-06-13, so
#        nothing has changed. Do not re-research this without new evidence.
#     7. A SHORT bounded libFuzzer run over the parsers (the `fuzz` job below, and fuzz/ in the
#        tree). It is not a conformance check and it is not a soak: its job is to prove the fuzz
#        targets still build and still run, and to catch an invariant that a committed RFC-vector
#        seed already violates. The targets assert INVARIANTS (the RFC 9396 bounds, the scope
#        round trip, the RFC 6749 s5.2 charset on every error body, "no generated credential
#        authenticates"), so a red here is a wrong ANSWER and not merely a crash.
#     8. No independent, CI-runnable RFC 8414 JSON Schema or metadata-validator tool (distinct
#        from an OAuth/OIDC mock server, which tests the opposite direction) could be confirmed
#        to exist as of 2026-08-08. If one surfaces later, wire it in following the same pinning
#        discipline as every other job in this file.
#
# NO continue-on-error anywhere: every step is load-bearing and a failure is RED. The
# cargo-mutants job is a deliberate exception to "failure is RED" in spirit only: it is a
# reporting job by design (see that job's comment), and it achieves non-blocking behaviour by
# never letting a step fail rather than by using continue-on-error, per house rule.

name: qa full suite

on:
  push:
    branches: [qa]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Everything dev.yml proves, re-run here because a push to qa is not required to have gone
  # through dev.yml first (e.g. a fast-forward or a direct promotion), so qa must be self-contained.
  #
  # THAT CLAIM WAS FALSE until 0.9.0 and the correction is the point of the extra steps below.
  # This job ran three commands, all at DEFAULT features, while dev.yml ran seven; a promotion to
  # qa therefore ran a STRICTLY WEAKER gate than the branch it was promoted from. Default features
  # is roughly 320 of this crate's 710 tests, so every feature-gated suite, and every no-backend
  # suite with it, reached the promotion branch unexecuted. If a step is added to dev.yml's
  # lint-and-test job it belongs here too, or this comment goes back to being untrue.
  lint-and-test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
      - name: tests (all features)
        run: cargo test -p oauth-as --locked --all-features
      # The no-backend build. See the long comment on the matching step in dev.yml for why the
      # feature set is "--all-features minus jwt-p256" expressed as a rule rather than a list.
      - name: tests (every feature EXCEPT the ES256 backend)
        run: |
          cargo test -p oauth-as --locked --features \
            axum,jwt,mtls,par,jar,client_assertion,dpop,resource-metadata,token-exchange,consent,rar,test-util
      - name: rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p oauth-as --locked --all-features --no-deps
      - name: doc tests (all features)
        run: cargo test -p oauth-as --locked --all-features --doc

  # MSRV verification. The floor is 1.75, and it is MEASURED rather than declared: 1.74 fails on
  # return-position impl Trait in the Storage trait, and 1.75 compiles clean. A declared floor
  # nobody builds on is a guess, so this job builds and tests on exactly that toolchain.
  #
  # Scoped to -p oauth-as ON PURPOSE, not --workspace. crates/oauth-as-conformance is the
  # independent harness: it is never published, nothing depends on it, and it is deliberately free
  # to require a much newer toolchain than the library. Building it here would make the harness's
  # dependencies silently dictate the library's MSRV, which is exactly backwards.
  #
  # Every feature combination is checked, because an optional dependency is perfectly capable of
  # raising the floor for the consumers who enable it while the default build stays fine.
  msrv:
    name: MSRV (1.75) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.75 toolchain
        uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.75
      # --locked throughout: an MSRV that only holds when cargo is free to pick different
      # dependency versions is not a floor anyone can rely on. Note this also requires every
      # entry in Cargo.lock to be PARSEABLE by this cargo, which is why base64ct and zeroize are
      # pinned below the versions that moved to edition 2024.
      # BUILD, not test, and the distinction is the whole point of the job.
      #
      # An MSRV is a promise to a CONSUMER: "your toolchain can compile this library". A consumer
      # compiles the library and its RUNTIME dependencies. They never compile our dev-dependencies,
      # because dev-dependencies are not part of the dependency graph of anyone who depends on us.
      #
      # Ours (oauth2, url) legitimately require far newer toolchains. RE-MEASURED after the
      # `jsonschema` dev-dependency was dropped, because that crate (rust-version 1.85) used to be
      # the loudest blocker and it is worth knowing whether removing it freed this job to test as
      # well as build. It did not: `cargo +1.75 test -p oauth-as --locked --no-run` now fails on
      # `litemap v0.7.5 ... requires rustc 1.81 or newer`, reached through
      # url -> idna -> idna_adapter -> icu_normalizer -> icu_properties -> icu_locid, and both
      # `url` and `oauth2` need it. Running the test suite here would therefore still measure OUR
      # tooling choices, not the consumer's constraint, and would push the declared floor up for a
      # reason no consumer ever experiences. Chasing pins to drag every dev-dependency back to 1.75
      # would trade real test quality for a number.
      #
      # So the floor is verified the way a consumer meets it: the library compiles. Behaviour is
      # verified by the full test suite on stable, in the fmt/clippy/test job above.
      - name: build on 1.75, default features
        run: cargo build -p oauth-as --locked
      # The jwt SURFACE, which since the signing seam landed carries no crypto dependency at all.
      - name: build on 1.75, jwt feature
        run: cargo build -p oauth-as --locked --features jwt
      # The built-in ES256 BACKEND, which is where p256 and its tree actually enter. Building only
      # `jwt` would no longer prove the floor for the crypto, because `jwt` no longer pulls any:
      # that is exactly what the seam changed, and this job has to change with it or it silently
      # stops checking the thing it was written to check.
      - name: build on 1.75, jwt-p256 backend
        run: cargo build -p oauth-as --locked --features jwt-p256

  # The `http` feature has its OWN, HIGHER floor, and it is reported separately rather than
  # averaged into one number. axum 0.8 declares rust-version 1.80, so no amount of care on our
  # side gets the router onto 1.75. A consumer who wants only the protocol core is not made to
  # pay for that, which is the whole point of the feature being optional.
  #
  # indexmap is pinned in Cargo.lock below the version that raised ITS floor to 1.85, so that this
  # number is set by axum (a dependency we chose deliberately) rather than drifting upward with an
  # incidental transitive crate nobody decided on.
  msrv-http:
    name: MSRV (1.80) http feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.80 toolchain
        uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.80-http
      - name: build on 1.80, http feature
        run: cargo build -p oauth-as --locked --features http
      - name: build on 1.80, all features
        run: cargo build -p oauth-as --locked --all-features

  # Hermetic half of the independent harness: RFC vectors and validator self-checks.
  rfc-vectors:
    name: RFC vectors (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # RED first: a corrupted expectation must fail the suite, or the suite proves nothing.
      - name: Prove the vector suite can fail (deliberate corruption)
        run: |
          set +e
          OAUTH_CONFORMANCE_SELFTEST_BREAK=pkce \
            cargo test --locked -p oauth-as-conformance --test rfc_vectors
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::vector suite passed with a corrupted PKCE expectation; gate is dead"
            exit 1
          fi
          echo "vector suite failed as required under deliberate corruption (exit $rc)"
      - name: RFC vector suite
        run: cargo test --locked -p oauth-as-conformance --test rfc_vectors

  # Gate self-test: RED-A (corrupted vector expectation fails), GREEN-A (clean vectors pass),
  # RED-B (black-box suite fails against a deliberately nonconformant stub AS). This must be
  # shown to pass BEFORE the live conformance-check job is trusted, hence the "needs" ordering
  # below.
  conformance-selftest:
    name: conformance gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Conformance gate self-test (must go RED on a nonconformant AS)
        run: scripts/oauth-conformance.sh --selftest

  # The live black-box half. Wired unconditionally and on purpose: if
  # crates/oauth-as/conformance-serve.sh does not exist yet in this tree, --check fails loudly
  # by design (see scripts/oauth-conformance.sh), and that RED is the correct outcome, not a
  # workflow bug. Includes the pinned third-party `oauth2 = "=5.0.0"` client drive.
  conformance-check:
    name: live black-box conformance
    runs-on: ubuntu-latest
    needs: [conformance-selftest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live conformance check against a served AS
        run: scripts/oauth-conformance.sh --check

  # The SECOND independent client, in a second language. Same discipline as every other gate
  # here: --selftest proves it can go red before --check's green is trusted, and the two are
  # separate steps in one job rather than two jobs so the ordering cannot be lost to a missing
  # `needs`. Nothing is conditional on the go toolchain being present: absent-is-FAIL, because a
  # gate that skips when its judge is missing is a gate that reports green for an untested AS.
  interop:
    name: second third-party client (golang.org/x/oauth2, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The version the job actually runs is pinned in
      # crates/oauth-as-conformance/interop/go/go.mod, with go.sum locking the module hashes.
      # This only supplies a toolchain new enough to build it.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Prove the interop gate can go RED
        run: scripts/oauth-interop.sh --selftest
      - name: Drive the live AS with a second independent client
        run: scripts/oauth-interop.sh --check

  # The third-party MCP-OAuth scanner. Read the HONESTY block above and the header of
  # scripts/oauth-mcp-lint.sh before touching this job; the argument for why the RFC 9728 fixture
  # is legitimate, and the reason each accepted finding is accepted, both live there.
  #
  # Two mechanisms on purpose, and they are not redundant. The selftest step runs the scanner from
  # a pinned pip install so the gate can be shown RED on both axes, which the composite action has
  # no way to do. The scan step then runs the project's OWN published action, so that what gates
  # this repository is the thing they ship rather than our reading of it.
  mcp-lint:
    name: authgent MCP-OAuth scanner (RFC 8414 / PKCE / RFC 9207 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # RED first, on both axes: no RFC 9728 document must fail (so the gate cannot pass having
      # silently lost its discovery hop), and an AS advertising `plain` PKCE and the implicit
      # grant must fail NAMING those checks (so the RFC 8414 checks are provably the ones doing
      # the work).
      - name: Prove the scanner gate can go RED
        run: scripts/oauth-mcp-lint.sh --selftest
      - name: Build the AS and the RFC 9728 fixture resource
        run: |
          cargo build --locked -p oauth-as --features axum,jwt-p256,resource-metadata \
            --example conformance_server --example protected_resource_fixture
      # Backgrounded servers always redirect their output to a file, never to a command
      # substitution, which would hang until the child closed its inherited stdout.
      - name: Serve the AS and the fixture resource
        run: |
          OAUTH_AS_ADDR=127.0.0.1:8914 OAUTH_AS_CONFORMANCE_SEED=1 \
            ./target/debug/examples/conformance_server > "$RUNNER_TEMP/as.log" 2>&1 &
          OAUTH_RS_ADDR=127.0.0.1:8915 OAUTH_AS_ISSUER=http://127.0.0.1:8914 \
            ./target/debug/examples/protected_resource_fixture > "$RUNNER_TEMP/rs.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8914/.well-known/oauth-authorization-server \
               && curl -sf -o /dev/null \
                  http://127.0.0.1:8915/.well-known/oauth-protected-resource; then
              echo "AS and fixture are up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the AS or the RFC 9728 fixture never came up"
          cat "$RUNNER_TEMP/as.log" "$RUNNER_TEMP/rs.log"
          exit 1
      # The scanner's own composite action, at the only reference that resolves. `baseline` puts
      # it in --diff mode: it exits nonzero only for a finding NOT already recorded and explained
      # in that file. A missing baseline fails safe rather than open, because the scanner treats
      # an absent baseline as empty and every finding then counts as new.
      - name: Scan the fixture resource, gating on anything new
        uses: authgent/authgent/.github/actions/mcp-lint@v0.3.4
        with:
          url: http://127.0.0.1:8915
          baseline: crates/oauth-as-conformance/authgent-baseline.json
          scanner-version: 0.3.4

  # Packaging must stay green so a release is never blocked by a stale manifest. Prints the
  # tarball file list to the job log so the published contents can be reviewed by a human
  # before any real publish (see the separate publish.yml, which is manually gated).
  package:
    name: cargo publish --dry-run and package listing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish dry run
        run: cargo publish --dry-run --locked -p oauth-as
      - name: package file list (review before any real publish)
        run: cargo package --list --locked -p oauth-as

  # A SHORT fuzz run, and deliberately not a soak.
  #
  # WHAT THIS JOB IS FOR, in order of importance:
  #   1. Proving the targets still COMPILE and still RUN. A fuzz target that no longer builds is
  #      worse than no fuzz target, because the directory still looks like coverage. `fuzz` is a
  #      workspace member so lint-and-test already catches a compile break on stable; this job is
  #      what catches a break that only shows up under the nightly sanitizer build, and it is the
  #      only thing that proves a target does not abort on its own seed corpus.
  #   2. Catching a SHALLOW regression: an invariant that a committed seed already violates, or
  #      one reachable within a minute of mutation from those seeds.
  # It is NOT a search for deep bugs. A minute per target finds what a minute finds, and claiming
  # more from it would be the kind of "fuzzing passed" statement this repository does not make.
  # A real hunt is `cargo +nightly fuzz run <target>` on a workstation, unbounded.
  #
  # A HARD GATE, not reporting-only. Unlike the mutation job below, a failure here is a crash or
  # a violated invariant on input the fuzzer actually produced: a defect, reproducible from the
  # artifact the run leaves behind, and not a judgement call about test strength.
  #
  # NIGHTLY, and that is contained. cargo-fuzz requires it, and nothing about this job touches
  # the library's MSRV: the `msrv` job above is scoped to `-p oauth-as` precisely so that a
  # member with a newer toolchain requirement cannot dictate the library's floor, and this member
  # adds no dependency to the published crate (it is a CONSUMER of it, exactly like a host).
  fuzz:
    name: fuzz targets (short bounded run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # FLOATING nightly, and the trade is worth naming. A dated nightly would make this job's
      # red always mean "a target broke" rather than sometimes "the compiler moved"; a floating
      # one means the sanitizer instrumentation is always the current one, and it means nobody
      # has to remember to bump a pin that will otherwise rot until the toolchain is unavailable.
      # If this job starts going red for compiler reasons rather than target reasons, pin it.
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # THE ROT CHECK, and the reason it is a step of its own rather than something the workspace
      # gate does for free. fuzz/ is EXCLUDED from the root workspace (see the root Cargo.toml for
      # the measurement that forced that), so `cargo clippy --workspace --all-targets` does not
      # see it. This is the replacement, and it is not weaker: it is the same lint at the same
      # severity, on the same push, and it runs BEFORE the fuzzing so a signature that moved under
      # a target is reported as a lint failure rather than as a confusing build error inside
      # cargo-fuzz.
      - name: fmt and clippy the fuzz targets (they must not rot)
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: run each target for a fixed budget
        env:
          # Wall-clock seconds per target. Eleven targets, so about seven minutes of fuzzing plus
          # the build. `-max_total_time` rather than `-runs` on purpose: the per-iteration cost
          # differs by two orders of magnitude between `scope_parse` and `par_request_object`
          # (which verifies an ECDSA signature every iteration), so a fixed run count would give
          # the cheap targets a tiny budget and the expensive ones an unbounded one.
          FUZZ_SECONDS: 40
        run: |
          set -euo pipefail
          # The output corpus goes to a scratch directory and the COMMITTED seeds are passed as a
          # read-only extra input. Writing into fuzz/corpus/ would leave the working tree dirty
          # and would grow the repository with machine-generated inputs nobody reviewed.
          out="$RUNNER_TEMP/fuzz-corpus"
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            mkdir -p "$out/$target"
            cargo +nightly fuzz run "$target" "$out/$target" "fuzz/corpus/$target" -- \
              -dict=fuzz/dictionaries/oauth.dict \
              -max_total_time="$FUZZ_SECONDS" \
              -max_len=8192 \
              -rss_limit_mb=4096 \
              -print_final_stats=1
            echo "::endgroup::"
          done
      # A crash leaves a reproducer in fuzz/artifacts/<target>/. It is the whole value of a red
      # here: without it the failure is a log line, and with it it is a test case.
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Reporting job, not a hard gate, by explicit house instruction: mutation runs are slow and
  # this is scoped to crates/oauth-as (the published library) rather than the whole workspace
  # or the conformance harness. Non-blocking behaviour is achieved by never letting a step
  # fail (the run's own exit code is captured and reported, but not propagated), NOT via
  # continue-on-error, per the "no continue-on-error anywhere" house rule. This is intended to
  # become a hard gate later, once a sensible survived-mutant baseline exists; until then it is
  # informative only, and its summary belongs in the job log for a human to read.
  mutants:
    name: cargo-mutants (reporting only, not a hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      - name: install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: run cargo-mutants over crates/oauth-as (informative, does not fail the job)
        run: |
          set +e
          cargo mutants --package oauth-as --timeout 300 --no-shuffle
          rc=$?
          set -e
          echo "cargo-mutants exit code: $rc (0 = no survivors, nonzero = survivors or error)"
          echo "This job is reporting-only by design; see the job comment in qa.yml. A"
          echo "nonzero exit here is informative and does NOT fail this job or the workflow."
          exit 0
