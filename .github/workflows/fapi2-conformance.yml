# GATES qa, plus manual dispatch. This job stands up the OpenID Foundation FAPI 2.0 Security
# Profile conformance suite in a docker compose stack (a Maven build of the suite plus a docker
# compose run) and drives this crate's FAPI 2.0 fixture through it. It is heavyweight and
# environment-sensitive, which is precisely qa.yml's charter ("everything too slow or too
# environment-sensitive to run on every push"), so it runs on push to the qa branch and NOT on
# dev's every-push path. It stays available by hand from the Actions tab.
#
# HONESTY, matching qa.yml's rule that nothing in this repository is allowed to look green
# without having earned it:
#
#   Running the suite (this job) requires NO OpenID Foundation membership, payment or agreement.
#   crates/oauth-as-conformance/EXTERNAL-TOOLING.md s2.4 verifies that directly from the OIDF's
#   own certification pages: only formal CERTIFICATION, a separate manual submission at
#   https://submissions.openid.net/ with a Declaration of Conformance and (for non-OIDF-member
#   FAPI 2 deployments that do not qualify for the open-source fee waiver) a fee, requires any of
#   that. This workflow does not perform a certification submission; it produces a run and, via
#   the suite's "Publish for certification", the log ZIP that a HUMAN carries to that separate
#   step.
#
#   The FAPI 2.0 fixture this job needs now EXISTS
#   (crates/oauth-as/examples/fapi2_conformance_server.rs: HTTPS listener, two static
#   private_key_jwt clients, a DPoP-verifying protected resource, mandatory PAR, and the
#   refresh-rotation-OFF switch RefreshRotation::Reuse), so this job is a genuine pass/fail gate
#   rather than a placeholder. DO NOT add continue-on-error: a green here must mean the suite
#   actually passed, and a red when this crate is nonconformant is the honest answer, exactly as
#   qa.yml's header argues for its own jobs. A green run is still not a certification; it is the
#   evidence a human reads before the DocuSign submission step.

name: FAPI 2.0 conformance

on:
  # Runs on promotion to the qa branch (qa.yml's charter: "everything too slow or too
  # environment-sensitive to run on every push", proven before main is considered). This job --
  # a Maven build of the OIDF suite plus a docker compose run -- is exactly that, so it belongs on
  # qa and NOT on dev's every-push path. Still available by hand from the Actions tab.
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      plan:
        description: >-
          OIDF test-plan string to run (see EXTERNAL-TOOLING.md s2.1 for how this string was
          derived, and s2.3 item 7 for why sender_constrain=dpop and not mtls is chosen here).
        required: false
        default: >-
          fapi2-security-profile-final-test-plan[openid=plain_oauth][client_auth_type=private_key_jwt][sender_constrain=dpop][fapi_profile=plain_fapi]

# LEAST PRIVILEGE FOR THE JOB TOKEN, matching qa.yml and dev.yml. This job only checks out,
# builds, and runs a local suite; it writes nothing back to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The plan runs under the script's default 1500s (25 min) cap (scripts/fapi2-conformance.sh),
  # which the 40-minute job cap is sized around: suite build (~8 min) + fixture build (~2 min) +
  # 25-min plan leaves headroom. The earlier "480" here was a temporary diagnostic cap to capture
  # early module logs fast; it was removed once the flow no longer hangs (a single browser-flow
  # module that never settles must not be able to starve the rest of the plan of its budget).

jobs:
  fapi2-conformance:
    name: FAPI 2.0 Security Profile suite (plain_oauth, gates qa)
    runs-on: ubuntu-latest
    # Suite build (~8 min) + fixture build (~2 min) + the plan (capped at 25 min inside the
    # script). 40 minutes is comfortable headroom; anything past it is a hang, and the default
    # 360-minute cap would just burn runner time silently. The script also dumps the suite server
    # log on exit so a timeout here is still diagnosable from the uploaded artifact.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        # SAME pin as qa.yml and dev.yml, so a run of this job builds against the exact toolchain
        # every other gate in this repository builds against, not a moving "latest".
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, 2026-08-06

      - name: Set up JDK (the OIDF suite is a Maven/Spring Boot application)
        # v6 verified against the actions/setup-java GitHub releases (latest tag v6.0.1, major
        # tag v6 exists) at the time this pin was written.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python (the suite's run-test-plan.py runner)
        # v7 verified against the actions/setup-python GitHub releases (latest tag v7.0.0, major
        # tag v7 exists) at the time this pin was written.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Docker is preinstalled on ubuntu-latest runners
        # Documented rather than actioned: GitHub's ubuntu-latest image ships Docker Engine and
        # the docker compose v2 plugin already. scripts/fapi2-conformance.sh itself checks for
        # both (`command -v docker`, `docker compose version`) and dies loudly if either is
        # missing, so there is no silent fallback if that ever stops being true.
        run: |
          docker --version
          docker compose version

      - name: Run the FAPI 2.0 Security Profile suite
        # NO continue-on-error. See the HONESTY header above: until the fixture example exists,
        # this step is SUPPOSED to fail at preflight, and that red is the correct, expected
        # result, not a flake to swallow. Do not add continue-on-error to "unblock" this job; the
        # only real unblock is building the fixture (EXTERNAL-TOOLING.md s2.5).
        env:
          FAPI2_PLAN: ${{ inputs.plan }}
        run: scripts/fapi2-conformance.sh

      # Uploaded unconditionally (not `if: failure()`): a failed preflight still writes nothing
      # under FAPI2_LOG_DIR, so there is nothing to upload in that case, but once the suite
      # actually runs, the run.log and (if "Publish for certification" was exercised) the
      # certification package ZIP are the entire point of this job existing, whether the plan
      # itself passed or failed. `if-no-files-found: warn` so an empty directory (the
      # preflight-stop case) does not itself fail an otherwise-correct red run twice over.
      - name: Upload conformance logs and certification package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fapi2-conformance-logs
          path: target/fapi2-conformance/
          if-no-files-found: warn
