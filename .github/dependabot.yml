# Version updates are monthly and grouped into one PR per ecosystem.
# Security updates are separate and run whenever an advisory is published.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: monthly
  ignore:
  - dependency-name: oauth2
  groups:
    all:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    all:
      patterns:
      - '*'
