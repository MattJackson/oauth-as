# Workspace root. The publishable crate is crates/oauth-as; its manifest is fully
# self-contained (no workspace inheritance) so it packages for crates.io as-is.
# crates/oauth-as-conformance is the independent black-box harness and is never published.
[workspace]
resolver = "2"
members = [
    "crates/oauth-as",
    "crates/oauth-as-conformance",
]
