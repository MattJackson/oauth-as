# Workspace root. The publishable crate is crates/oauth-as; its manifest is fully
# self-contained (no workspace inheritance) so it packages for crates.io as-is.
# crates/oauth-as-conformance is the independent black-box harness and is never published.
[workspace]
resolver = "2"
members = [
    "crates/oauth-as",
    "crates/oauth-as-conformance",
    # The first DATABASE-BACKED Storage implementation. A separate crate, never a feature of the
    # core: a Postgres driver is a large tree that must not appear in the publishable crate's
    # manifest even optionally, and implementing the trait from OUTSIDE is what proves the seam is
    # usable through the public API alone. Not published; see its own README.
    "crates/oauth-as-postgres",
    # A REAL DOWNSTREAM CONSUMER of `delegate_storage!`, and the only thing here that can gate it:
    # `macro_rules!` resolves an emitted `#[cfg(feature = ...)]` against the crate the macro expands
    # IN, so the macro's forwarders can only be checked from OUTSIDE oauth-as. The doctest cannot do
    # it (rustdoc uses the declaring crate's cfgs). Never published; asks for no features, so it adds
    # nothing to the unification described below. See its own Cargo.toml.
    "crates/oauth-as-delegate-fixture",
]

# fuzz/ IS EXCLUDED, and the reason is FEATURE UNIFICATION rather than taste. Read this before
# moving it into `members`, because it was tried there first and it does not work today.
#
# The fuzz targets exist to attack the parsers behind the optional features (`par`, `jar`, `dpop`,
# `client-assertion`, `rar`, `http`, `jwt`, `mtls`), so the fuzz manifest has to turn those on.
# Under resolver 2, a feature any workspace member asks for is enabled for EVERY member's build of
# that package in the same `cargo build --workspace` invocation. So making fuzz/ a member silently
# turns those features on for `crates/oauth-as-postgres` and for `crates/oauth-as`'s own test
# targets, and MEASURED, on 2026-08-08, that breaks the workspace gate in two places:
#
#   1. CORRECTED on 2026-08-09, and the earlier text here was FALSE. It said
#      `crates/oauth-as-postgres` does not implement `Storage::put_pushed_authorization_request`,
#      `take_pushed_authorization_request` or `claim_replay_id`, and called that a REAL GAP that
#      left PAR and DPoP hosts unable to use the store. It implements all three:
#      `put_pushed_authorization_request`, `take_pushed_authorization_request` and
#      `claim_replay_id` in crates/oauth-as-postgres/src/store.rs (named rather than cited by line,
#      because line numbers in a file that keeps changing go stale silently), and
#      `cargo build -p oauth-as-postgres --features par,dpop,client-assertion` compiles clean.
#   2. ALSO CORRECTED on 2026-08-09, and the earlier text here was FALSE TOO. It said
#      `crates/oauth-as/tests/http_par_jar_routing.rs` is gated
#      `#![cfg(all(feature = "http", feature = "par"))]` while calling `axum::Router` and
#      `axum::serve`, so that `http` + `par` without `axum` failed to build. That file is gated
#      `#![cfg(all(feature = "axum", feature = "par"))]` today, with a comment on the gate giving
#      the reason, and MEASURED at commit bc111da in a clean worktree,
#      `cargo build -p oauth-as --tests --features http,par` compiles.
#
# So BOTH stated reasons are now gone, and the honest statement is that the measurement this
# exclusion was justified by no longer reproduces. That is NOT the same as saying fuzz/ should be
# moved into `members`: the feature-unification mechanism described above is unchanged, membership
# would still turn `par`, `jar`, `dpop`, `client-assertion`, `rar`, `http`, `jwt` and `mtls` on for
# every other member's build, and what that costs today has not been measured. WHETHER THE
# EXCLUSION SHOULD REMAIN IS AN OPEN QUESTION FOR THE OWNER, not one this comment decides. It is
# left in place because removing a working arrangement on the strength of two disproven reasons
# would be a change made for no measured benefit. `cargo package --list -p oauth-as` is unaffected
# either way; nothing in crates/oauth-as depends on fuzz/, in any configuration, so fuzz/ carries
# its own `[workspace]` table and resolves independently.
#
# ROT PROTECTION, which is what membership was wanted for, is kept and is not weaker for being a
# separate invocation: .github/workflows/qa.yml's `fuzz` job runs `cargo fmt --check` and
# `cargo clippy --all-targets -- -D warnings` against fuzz/Cargo.toml before it runs anything, so
# a target that stops compiling after a signature moves is still a RED, on every push to qa.
exclude = ["fuzz"]

# COMPILE SETTINGS, and an honest note about their reach.
#
# Cargo profiles are honored ONLY for the workspace being built. A consumer who depends on
# oauth-as compiles it with THEIR profile, and nothing written here reaches them. So these
# settings govern our own builds, benchmarks and size measurements; they are not, and cannot be,
# a performance promise to a consumer.
#
# What actually determines a consumer's cost is the shape of the code, not this table:
#   * AuthorizationServer<S, C> is generic over the host's Storage and Clock, so its code is
#     monomorphized per (Storage, Clock) pair the host instantiates. One pair is the normal case
#     and costs one copy; a host that instantiates several pays for several. This is a deliberate
#     trade: generics keep the storage seam allocation-free and devirtualized, where a
#     `dyn Storage` would add an indirect call on every storage operation on the token path.
#   * The default feature set is empty, so a consumer who wants only the protocol core links no
#     HTTP stack and no signing code at all.
# The guidance we give consumers lives in the README rather than here, where they would never
# see it.
[profile.release]
# Cross-crate inlining. Worth real size and speed on a crate this small, because most of the
# hot paths are thin wrappers over the storage seam that only become cheap once inlined.
lto = "fat"
# One codegen unit: strictly better optimization at the cost of build time, which we can afford
# because the crate is small.
codegen-units = 1
opt-level = 3
# Strip symbols from OUR binaries (the conformance example). Does not affect the published rlib.
strip = "symbols"
# NB: panic = "abort" is deliberately NOT set. This crate is a library embedded in a host, and a
# host is entitled to catch a panic at its request boundary rather than lose the process. Forcing
# abort on our own release builds would also make the example behave unlike a real embedding.

# A profile for measuring what the crate actually costs, rather than guessing. Same optimization
# as release, but keeps debug info so size attribution tools can name what is big.
[profile.sizecheck]
inherits = "release"
strip = "none"
debug = 1
